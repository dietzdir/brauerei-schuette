<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145863" />
      <stop offset="100%" stop-color="#082c32" />
    </linearGradient>
    <linearGradient id="hopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00A8BC" />
    </linearGradient>
    <linearGradient id="hopLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#00A8BC" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Hop Cone Graphic -->
  <g transform="translate(0, -10)">
    <!-- Stem -->
    <path d="M256,108 C256,84 274,68 296,64 C284,78 280,94 272,112 Z" fill="#2dd4bf" />
    <path d="M246,112 C240,96 232,84 220,78 C238,82 250,96 256,112 Z" fill="#00A8BC" opacity="0.7" />

    <!-- Top Hop Leaves / Scales Layer 1 -->
    <path d="M256,128 C280,140 292,168 256,204 C220,168 232,140 256,128 Z" fill="url(#hopLight)" />

    <!-- Layer 2 (Upper Side Bracts) -->
    <path d="M216,160 C182,180 176,218 214,248 C238,222 234,186 216,160 Z" fill="url(#hopGrad)" />
    <path d="M296,160 C330,180 336,218 298,248 C274,222 278,186 296,160 Z" fill="url(#hopGrad)" />

    <!-- Layer 3 (Center Scale) -->
    <path d="M256,192 C286,210 296,248 256,290 C216,248 226,210 256,192 Z" fill="#ffffff" />

    <!-- Layer 4 (Middle Side Bracts) -->
    <path d="M188,228 C150,254 152,298 196,332 C222,300 216,258 188,228 Z" fill="url(#hopGrad)" />
    <path d="M324,228 C362,254 360,298 316,332 C290,300 296,258 324,228 Z" fill="url(#hopGrad)" />

    <!-- Layer 5 (Lower Center Scale) -->
    <path d="M256,270 C290,292 298,336 256,380 C214,336 222,292 256,270 Z" fill="url(#hopLight)" />

    <!-- Layer 6 (Lower Side Bracts) -->
    <path d="M204,312 C174,340 182,382 222,410 C242,382 236,344 204,312 Z" fill="url(#hopGrad)" />
    <path d="M308,312 C338,340 330,382 290,410 C270,382 276,344 308,312 Z" fill="url(#hopGrad)" />

    <!-- Bottom Tip Scale -->
    <path d="M256,360 C280,380 284,416 256,448 C228,416 232,380 256,360 Z" fill="#ffffff" />
  </g>
</svg>
